# Конфиг ether-server. Этот файл — образец: скопируй в config.<env>.yaml
# (локально config.dev.yaml, на сервере /etc/ether/config.prod.yaml) и заполни
# нужное. Все поля, кроме провайдеров входа, опциональны — лишнее можно удалить
# или оставить пустым.
#
# Незнакомый ключ (опечатка) — ошибка старта, а не молча пустое значение.

# Адрес HTTP/WebSocket-сервера. Пусто → :8080. На проде наружу смотрит Caddy,
# поэтому слушаем локальный порт.
addr: ":8080"

# ── Вход ─────────────────────────────────────────────────────────────────────
# Хотя бы один провайдер обязателен, иначе войти нечем. Сервер проверяет
# ID-token по публичным ключам провайдера — секретов провайдеров не нужно.

# Числовой client id приложения из @BotFather.
telegram_client_id: ""
# Bundle id приложения (нативный Sign in with Apple; обычно один).
apple_client_ids: []
# OAuth client id, под которые выписан токен: у Android, iOS и Web они разные.
google_client_ids: []
#  - "123-android.apps.googleusercontent.com"
#  - "123-ios.apps.googleusercontent.com"

# ── Хранилище и геокодинг ────────────────────────────────────────────────────

# Путь к файлу SQLite. Пусто → ether.<env>.db рядом с рабочим каталогом.
db: ""

# Базовый URL Nominatim. Пусто → публичный nominatim.openstreetmap.org
# (лимит 1 req/s, для прода нужен свой инстанс).
nominatim_url: ""

# ── Пуши (опционально) ───────────────────────────────────────────────────────
# Оба пусты → пуши выключены, сервер работает как раньше.

# id проекта Firebase, напр. ether-5f4b6
fcm_project_id: ""
# путь к service-account JSON (в git не идёт)
fcm_credentials_file: ""

# ── Служебный Telegram-канал: жалобы, регистрации, сводки, команды модерации ──
# Оба пусты → уведомления выключены (жалобы всё равно пишутся в БД и в лог).
#
# ВНИМАНИЕ: getUpdates у бота одиночный — нельзя держать локальный сервер с теми
# же значениями при работающем проде: два опросчика начнут отбирать друг у друга
# обновления (Telegram ответит 409 Conflict). Для отладки нужен свой бот и канал.

# токен бота из @BotFather (секрет)
telegram_notify_token: ""
# chat_id канала, напр. -1001234567890; бот должен быть в нём админом
telegram_notify_chat_id: ""

# ── Наблюдаемость (опционально) ──────────────────────────────────────────────

# DSN проекта Sentry для ошибок и паник. Пусто → выключено.
sentry_dsn: ""

# ── Версии клиента (опционально) ─────────────────────────────────────────────
# Ответ на GET /version: пора ли обновляться. Блока нет → всем отвечаем ok.
# Подробности и причины — в version.go.
#
# Блок платформы можно не заводить вовсе (тогда про неё ничего не говорим), но
# если он есть — ВСЕ ТРИ поля обязательны. Пропущенное или невалидное значение,
# как и min выше latest, — ошибка старта с указанием платформы и поля.
#
#   min          ниже неё сборка объявлена неработающей: блокирующий экран.
#                Ставить осознанно и ниже всех живых сборок, пока никого не
#                блокируем: механизм проверен, но не мешает.
#   latest       свежая версия. Сравнение строгое «меньше», поэтому dev- и
#                TestFlight-сборки ВПЕРЕДИ latest обновляться не просят.
#   latest_since дата выхода latest. Обновление предлагаем НЕДЕЛЕЙ ПОЗЖЕ: и у
#                Apple, и у Google раскатка идёт долями пользователей несколько
#                дней, а до того обновиться человек физически не может. Даты по
#                платформам разные: в стора мы выходим не одновременно.
#
# client_versions:
#   ios:
#     min: 1.0.0
#     latest: 1.3.0
#     latest_since: 2026-08-22
#   android:
#     min: 1.0.0
#     latest: 1.3.0
#     latest_since: 2026-08-29
